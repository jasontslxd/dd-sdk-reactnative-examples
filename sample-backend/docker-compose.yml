name: test
services:
  python-app:
    container_name: python-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ddtrace-run python app.py
    networks:
      - kong-net
    volumes:
      - ./:/app
    ports:
      - 4000:4000
    env_file:
      - .env
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_API_KEY=${DD_API_KEY}
      - DD_APP_KEY=${DD_APP_KEY}
      - DD_TRACE_DEBUG=false
      - DD_DYNAMIC_INSTRUMENTATION_ENABLED=TRUE
      - DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED=true
      - DD_TRACE_AGENT_PORT=8126
      - DD_ENV=dev
      - DD_SERVICE=python-backend
      - DD_VERSION=1.3.5

      - DD_TRACE_HEADER_TAGS=my-sample-header:sample_header

    depends_on:
      - dd-agent

  dd-agent:
    cgroup: host
    container_name: dd-agent
    image: gcr.io/datadoghq/agent:7
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=datadoghq.com
      - DD_AGENT_HOST=dd-agent

      - DD_LOGS_INJECTION=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true

      - DD_REMOTE_CONFIGURATION_ENABLED=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true # Receive APM data from other containers
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true # Receive metrics from other containers
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_CODE_ORIGIN_FOR_SPANS_ENABLED=true

      - DD_RUNTIME_METRICS_ENABLED=true # Enables the collection of runtime metrics. Metrics are sent to the Datadog agent, as configured for the instrumented application.
      - DD_RUNTIME_METRICS_RUNTIME_ID_ENABLED=true #  Enables enhanced runtime metrics, providing a runtime_id tag along with every metric. The runtime_id represents the application’s process identifier and allows you to directly correlate runtime metrics with individual running applications.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "8125:8125/udp"   # DogStatsD metrics
      - "8126:8126"       # APM tracing port
    networks:
      - kong-net

networks:
  kong-net:
    name: kong-net
    driver: bridge